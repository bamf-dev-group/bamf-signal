name: digest-refresh

on:
  schedule:
    # 04:40 America/Denver on weekdays. 11:40 UTC equals 04:40 MST (UTC-7).
    # GitHub cron is UTC only, so during daylight saving time (MDT, UTC-6)
    # this fires at 05:40 local. Adjust to "40 10 * * 1-5" if exact local time matters.
    - cron: "40 11 * * 1-5"
    # Backup slot at 17:40 UTC (10:40 MST) for a late or dropped 11:40 run. Safe to run twice
    # in one day: a rerun with the same content leaves digests/latest.md untouched, so there
    # is no second commit, and it never shrinks the digest or hides an open coverage gap.
    - cron: "40 17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build digests/latest.md and show the diff, but do not commit or push"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: digest-refresh
  cancel-in-progress: false

env:
  ISSUE_TITLE: "digest-refresh failure"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild digests/latest.md
        id: build
        run: python scripts/digest_refresh.py

      - name: Show diff
        run: git diff --stat -- digests/latest.md

      # Staleness is decided in the build step, before this commit. A stale run is
      # written with the newest entry date in the title and a STALE line, never
      # with today's date. It is still committed so the Fetched line changes and
      # the schedule stays alive, and the job fails in the next step.
      # Commits only happen on main; other refs and dry runs just build and show the diff.
      - name: Commit and push
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/latest.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "digest: refresh latest.md (automated)"
          for attempt in 1 2 3; do
            # -X theirs keeps this run's freshly built file if a concurrent commit conflicts.
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed" >&2
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Fail if newest entry is stale
        if: steps.build.outputs.stale == 'true'
        run: |
          echo "Newest changelog entry (${{ steps.build.outputs.newest }}) is more than 2 weekdays old." >&2
          exit 1

      - name: Close failure issue after a good run
        if: success() && github.ref == 'refs/heads/main' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

      - name: Open or update failure issue
        if: failure() && github.ref == 'refs/heads/main' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The digest-refresh workflow failed (fetch error, push error, or newest entry more than 2 weekdays old). Run: ${run_url}"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi
